name: Firebase preview for pull requests

on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: ./scripts/build-site.sh
      # Deploys to a temporary preview URL (7 days) and comments it on the pull request.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GBOY_JS }}
          expires: 7d
          projectId: gboy-js
